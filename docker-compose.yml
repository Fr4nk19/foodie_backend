services:
  # ── Laravel Application ──────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: foodie_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      APP_NAME: Foodie
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: foodie_db
      DB_USERNAME: foodie_user
      DB_PASSWORD: foodie_pass
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stderr
      LOG_LEVEL: debug
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Persist storage (logs, uploads, etc.)
      - app_storage:/var/www/html/storage/app
    networks:
      - foodie_net

  # ── MySQL Database ───────────────────────────
  db:
    image: mysql:8.4
    container_name: foodie_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: foodie_db
      MYSQL_USER: foodie_user
      MYSQL_PASSWORD: foodie_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_pass"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - foodie_net

  # ── phpMyAdmin (optional, dev only) ─────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: foodie_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root_pass
    depends_on:
      - db
    networks:
      - foodie_net

volumes:
  db_data:
  app_storage:

networks:
  foodie_net:
    driver: bridge
